<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GiftCard — buy, send, and manage gift cards">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- Version and Update Management -->
  <meta name="version" content="1.9.0">
  <meta name="build-date" content="2026-11-04">

  <!-- PWA meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GiftCard">
  <meta name="application-name" content="GiftCard">
  <meta name="msapplication-TileColor" content="#0175C2">
  <meta name="msapplication-tap-highlight" content="no">
  <meta name="theme-color" content="#0175C2">

  <!-- iOS meta tags & icons -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="shortcut icon" href="favicon.png">

  <title>GiftCard</title>
  <link rel="manifest" href="manifest.json">
  <!-- sql.js loader for Drift web (fallback if IndexedDB is unavailable) -->
  <script>
    (function() {
      function setLocateFile(base) {
        if (!window.initSqlJs) return;
        const original = window.initSqlJs;
        window.initSqlJs = function(config) {
          config = config || {};
          config.locateFile = function(file) { return base + file; };
          return original(config);
        };
      }
      function loadScript(src) {
        return new Promise(function(resolve, reject) {
          var s = document.createElement('script');
          s.src = src;
          s.onload = resolve;
          s.onerror = reject;
          document.head.appendChild(s);
        });
      }
      // Try local first (expects sql-wasm.js and sql-wasm.wasm in /web)
      loadScript('sql-wasm.js')
        .then(function(){ setLocateFile('./'); })
        .catch(function(){
          // Fallback to CDN
          var cdn = 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/';
          loadScript(cdn + 'sql-wasm.js').then(function(){ setLocateFile(cdn); });
        });
    })();
  </script>

</head>
<body>
  <script>
    // Suppress Chrome/Edge install mini-infobar. Do not show custom install UI.
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
