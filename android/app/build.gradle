plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.ubx.malipo_agent"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.ubx.malipo_agent"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 26  // Android 8.0 (API level 26) - Improved security and features
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }


     signingConfigs {
        release {
            keyAlias 'malipo-agent-key-alias'
            keyPassword 'malipo2024!'
            storeFile file('malipo-agent-release-key.keystore')
            storePassword 'malipo2024!'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            pseudoLocalesEnabled false
            zipAlignEnabled true
        }
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Add Google Play Services dependencies to prevent R8 errors
    implementation 'com.google.android.play:core:1.10.3'
    implementation 'com.google.android.play:core-ktx:1.8.1'
    
    // Niimbot Printer SDK dependencies
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    
    // Additional dependencies for printer functionality
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Permission handling
    implementation 'com.guolindev.permissionx:permissionx:1.7.1'
    
    // JSON processing
    implementation 'com.google.code.gson:gson:2.11.0'
    
    // Threading
    implementation 'androidx.concurrent:concurrent-futures:1.1.0'
}
